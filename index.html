<!DOCTYPE html>
<!-- ============================================================================
 KINGPIN: BLOODLINE  |  index.html
 ----------------------------------------------------------------------------
 The static skeleton of the game. It has three mount points and loads the
 stylesheet and the scripts. It contains no game logic.
   #app    : the game UI. js/11-render.js rewrites it after every change.
   #start  : the animated title screen (js/30-start.js).
   #toast  : small pop-up notices, e.g. achievements (js/23-achievements.js).
 Everything is local (fonts, logo, scripts), so the game works offline, which
 matters once it is wrapped as an Android app.
 ============================================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kingpin: Bloodline</title>

<!-- viewport-fit=cover lets the page draw under phone notches; style.css then
     pads with env(safe-area-inset-*) so nothing important is hidden. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">

<!-- Fonts (bundled in /fonts) and all visual styling. -->
<link rel="stylesheet" href="style.css">

<!-- SCRIPTS: plain scripts that share one global scope. `defer` downloads
     them in parallel without blocking the page, then runs them IN THIS ORDER
     once the HTML is parsed. Order only matters for code that runs at load
     time (data tables first, boot last). -->
<script defer src="js/01-config.js"></script>
<script defer src="js/02-utils.js"></script>
<script defer src="js/03-looks-data.js"></script>
<script defer src="js/04-portrait.js"></script>
<script defer src="js/05-character.js"></script>
<script defer src="js/06-levels.js"></script>
<script defer src="js/07-market-fatigue.js"></script>
<script defer src="js/08-gear-jobs.js"></script>
<script defer src="js/09-family.js"></script>
<script defer src="js/10-state.js"></script>
<script defer src="js/11-render.js"></script>
<script defer src="js/12-save.js"></script>
<script defer src="js/13-actions.js"></script>
<script defer src="js/14-arrest-travel.js"></script>
<script defer src="js/15-heirs-property.js"></script>
<script defer src="js/16-year.js"></script>
<script defer src="js/17-police.js"></script>
<script defer src="js/18-safe-lab.js"></script>
<script defer src="js/19-bank.js"></script>
<script defer src="js/20-casino.js"></script>
<script defer src="js/21-settings.js"></script>
<script defer src="js/22-audio.js"></script>
<script defer src="js/23-achievements.js"></script>
<script defer src="js/24-tutorial.js"></script>
<script defer src="js/25-news.js"></script>
<script defer src="js/26-intel.js"></script>
<script defer src="js/27-help.js"></script>
<script defer src="js/28-dev.js"></script>
<script defer src="js/29-menus.js"></script>
<script defer src="js/30-start.js"></script>
<script defer src="js/99-boot.js"></script>
</head>

<body>

<!-- GAME UI MOUNT: hidden until the player starts or loads a game. -->
<div id="app"></div>

<!-- START SCREEN: a full-screen overlay above the game.
     #st-logo  : studio logo, faded in/out by the .p1/.p2 classes
     #st-title : "Kingpin / Bloodline" title (.p3)
     #st-panel : menu buttons written by stPanel() (.p4)
     Tapping anywhere before .p4 skips the intro (stSkip). -->
<div id="start" role="region" aria-label="Start screen">
  <div id="st-logo"><img alt="Black Obsidian Games" src="logo.jpg" width="900" height="900" decoding="async"></div>
  <div id="st-main">
    <div id="st-in">
      <h1 id="st-title" aria-label="Kingpin: Bloodline"><span>Kingpin</span><em>Bloodline</em></h1>
      <div id="st-panel"></div>
    </div>
  </div>
</div>

<!-- TOAST LAYER: notices that float above everything and fade out. It sits
     outside #app so re-rendering the game never wipes a toast mid-animation. -->
<div id="toast" aria-live="polite"></div>

</body>
</html>
